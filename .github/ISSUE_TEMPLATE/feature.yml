name: Feature request
description: Propose an improvement to the community Nest SDK
title: '[Feature]: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What NestJS integration use case is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: input
    id: upstream
    attributes:
      label: Node SDK or SendLib reference
      description: Link the relevant contract when this depends on upstream behavior.
