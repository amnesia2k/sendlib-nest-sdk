name: Upstream contract change
description: Report Node SDK or SendLib API drift affecting the Nest adapter
title: '[Contract]: '
labels: [api-contract]
body:
  - type: markdown
    attributes:
      value: Provide sanitized evidence only. Never submit credentials, personal addresses, or production content.
  - type: dropdown
    id: evidence
    attributes:
      label: Evidence type
      options:
        - Node SDK public API change
        - Official SendLib documentation change
        - Sanitized observed behavior
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source URL or reference
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What changed?
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Nest SDK compatibility impact
    validations:
      required: true
